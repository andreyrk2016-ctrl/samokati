name: Импорт товаров с Google Диска

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-drive
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: pip install gdown pillow requests numpy

      - name: Скачать и сжать товары с Диска
        run: python import_from_drive.py

      - name: Закоммитить товары
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A csd
          if git diff --cached --quiet; then
            echo "Изменений нет"
          else
            git commit -m "Импорт товаров из папки CSD на Google Диске"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi
