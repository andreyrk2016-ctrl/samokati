name: Сборка каталога и публикация сайта

on:
  push:
    branches:
      - main
      - master
      - claude/trick-scooter-sales-site-4d8xfd
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать код
        uses: actions/checkout@v4

      - name: Собрать каталог из папки csd
        run: python3 build_catalog.py

      - name: Опубликовать сайт в ветку gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Сборка сайта из ${GITHUB_SHA}" --allow-empty
          git push --force origin HEAD:gh-pages
